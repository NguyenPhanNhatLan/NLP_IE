name: Build & Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: nlp_ie
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: [self-hosted, Linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set lowercase image name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "DOCKER_IMAGE=${REGISTRY}/${OWNER}/${IMAGE_NAME}:latest" >> $GITHUB_ENV

      - name: Login to Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ${{ secrets.REGISTRY_URL }} \
            -u ${{ secrets.REGISTRY_USERNAME }} \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE .

      - name: Push Docker image
        run: |
          docker push $DOCKER_IMAGE

  deploy:
    name: Pull & Deploy
    needs: build-and-push
    runs-on: [self-hosted, Linux]

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "${{ secrets.SSH_PRIVATE_KEY }}"
          
          cat > ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH Connection
        run: |
          ssh -vvv -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "whoami && hostname"

      - name: Deploy via SSH
        run: |
          ssh -vvv -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            docker login ${{ secrets.REGISTRY_URL }} \
              -u ${{ secrets.REGISTRY_USERNAME }} \
              -p ${{ secrets.GITHUB_TOKEN }} &&
            cd ${{ secrets.GROUP_NAME }}/${{ secrets.CONTAINER_NAME }} &&
            docker compose pull &&
            docker compose down &&
            docker compose up -d --remove-orphans
          "